name: package-cleanup

# weekly, not on each publish: every release of every tn and okayat library published a package and so ran this
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/delete-package-versions@v5
        with: 
          package-name: 'com.tn.tn-parent'
          package-type: 'maven'
          min-versions-to-keep: 10
          delete-only-pre-release-versions: "true"
      - uses: actions/delete-package-versions@v5
        with: 
          package-name: 'com.tn.tn-lang'
          package-type: 'maven'
          min-versions-to-keep: 10
          delete-only-pre-release-versions: "true"    
